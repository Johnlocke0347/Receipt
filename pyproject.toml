[project]
name = "receipt-orchestrator"
version = "0.1.0"
description = "RECEIPT: cross-chain agent credit backed by private, attested work"
requires-python = ">=3.12"
dependencies = [
    "base58>=2.1.1",
    "ecdsa>=0.19.2",
    "httpx>=0.28.1",
    "pycryptodome>=4.4.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ANN", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

